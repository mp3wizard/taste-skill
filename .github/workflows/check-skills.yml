name: Check skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Every SKILL.md frontmatter parses (as Claude Code and Codex parse it)
        run: |
          npm install --ignore-scripts --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
      - name: Scripts parse
        run: for f in skills/taste-skill/scripts/*.mjs skills/taste-skill/scripts/lib/*.mjs skills/taste-skill/assets/*.js; do node --check "$f" || exit 1; done
      - name: Browser profile cleanup regression
        run: node --test tests/profile-cleanup.mjs
